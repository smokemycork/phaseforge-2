name: Build & Package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # needed to attach installers to a GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: DSP unit tests
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      # ------------------------------------------------------------------ Windows
      - name: Make sure Inno Setup is installed
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $build = (Resolve-Path "build\PhaseForge_artefacts\Release").Path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" "/DBuildDir=$build" "installer\windows\PhaseForge.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      # -------------------------------------------------------------------- macOS
      - name: Build macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x installer/macos/build-pkg.sh
          installer/macos/build-pkg.sh build "${{ steps.ver.outputs.version }}" dist
          ls -la dist

      # ---------------------------------------------------------------- artifacts
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PhaseForge-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
